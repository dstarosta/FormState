name: Deploy Guide to GitHub Pages
run-name: Deploy Guide to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Record sizes before minify
        run: stat -c '%s %n' ./docs/guide.html ./docs/guide.css > /tmp/sizes-before.txt

      - name: Minify
        uses: dra1ex/minify-action@v1.0.3

      - name: Verify minify shrank files
        run: |
          echo "=== before ==="; cat /tmp/sizes-before.txt
          echo "=== after  ==="; stat -c '%s %n' ./docs/guide.html ./docs/guide.css

      - name: Rename for Pages
        run: mv ./docs/guide.html ./docs/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
